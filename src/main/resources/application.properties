spring.application.name=room-reservation

# --- Datasource: in-memory H2 in PostgreSQL compatibility mode (zero setup) ---
spring.datasource.url=jdbc:h2:mem:roomdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=

# --- Schema is owned by Flyway; Hibernate only validates it ---
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- H2 console (dev only) ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Pagination: cap page size so clients cannot request huge pages ---
spring.data.web.pageable.max-page-size=100

# --- Security: single in-memory user for write endpoints (HTTP Basic) ---
# Override in any real environment: APP_USER / APP_PASSWORD
spring.security.user.name=${APP_USER:admin}
spring.security.user.password=${APP_PASSWORD:admin123}
