# Profile "postgres": run against PostgreSQL (see compose.yaml) instead of in-memory H2.
# Activate with --spring.profiles.active=postgres or SPRING_PROFILES_ACTIVE=postgres.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:room_reservation}
spring.datasource.username=${DB_USER:room}
spring.datasource.password=${DB_PASSWORD:room}

# Common migrations + PostgreSQL-only ones (exclusion constraint against overlapping bookings)
spring.flyway.locations=classpath:db/migration,classpath:db/postgresql

spring.h2.console.enabled=false
